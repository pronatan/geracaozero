<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Discord - Geração Zero</title>
  <link rel="icon" type="image/png" href="assets/img/logo.png?v=1">
  <link rel="stylesheet" href="assets/css/bulma.min.css">
  <link rel="stylesheet" href="assets/css/gz.css?v=30">
</head>
<body>
<header class="section">
  <div class="logo container">
    <a href="/"><img src="assets/img/logo.png?v=1" alt="Geração Zero"></a>
  </div>
</header>
<main class="section">
  <div class="container">
    <div class="columns is-centered">
      <div class="column is-5">
        <article class="article produto-sidebar">
          <h1 class="article-title"><i class="fab fa-discord"></i> <span id="da-title">Discord</span></h1>
          <div class="article-content">
            <p id="da-msg" class="checkout-msg is-hidden" aria-live="polite"></p>
            <p class="checkout-note" id="da-help">
              Use o <b>ID do Discord</b> (não o nick). No app: Configurações → Avançado → Modo desenvolvedor →
              clique direito no seu perfil → Copiar ID.
            </p>
            <p class="checkout-note">
              O bot precisa poder te mandar DM. Entre no servidor:
              <a href="https://discord.gg/pAtKdPHBk2" target="_blank" rel="noreferrer">discord.gg/pAtKdPHBk2</a>
            </p>

            <div id="da-step-id">
              <div class="field">
                <label class="label" for="da-discord-id">ID do Discord</label>
                <div class="control">
                  <input id="da-discord-id" class="input" type="text" inputmode="numeric" placeholder="1437514165144129537" autocomplete="off">
                </div>
              </div>
              <button type="button" id="da-btn-send" class="button is-link is-fullwidth" style="background:#5865F2;border-color:#5865F2">
                Enviar código na DM
              </button>
            </div>

            <div id="da-step-code" class="is-hidden" style="margin-top:1rem">
              <div class="field">
                <label class="label" for="da-code">Código da DM</label>
                <div class="control">
                  <input id="da-code" class="input" type="text" inputmode="numeric" maxlength="8" placeholder="000000" autocomplete="one-time-code">
                </div>
              </div>
              <button type="button" id="da-btn-confirm" class="button is-success is-fullwidth">Confirmar</button>
              <button type="button" id="da-btn-back" class="button is-light is-fullwidth" style="margin-top:0.5rem">Voltar</button>
            </div>

            <p class="checkout-note" style="margin-top:1rem">
              <a href="/login">Voltar ao login</a> · <a href="/conta">Minha conta</a>
            </p>
          </div>
        </article>
      </div>
    </div>
  </div>
</main>
<script src="assets/js/config.js?v=3"></script>
<script src="assets/js/gz.js?v=9"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/js/all.min.js"></script>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var mode = (params.get("mode") === "link") ? "link" : "login";
  var title = document.getElementById("da-title");
  if (title) title.textContent = mode === "link" ? "Vincular Discord" : "Entrar com Discord";

  function $(id) { return document.getElementById(id); }
  function setMsg(text, type) {
    var el = $("da-msg");
    if (!el) return;
    el.textContent = text || "";
    el.className = "checkout-msg" + (type ? " is-" + type : "") + (text ? "" : " is-hidden");
  }
  function show(el, yes) { if (el) el.classList.toggle("is-hidden", !yes); }

  $("da-btn-send").addEventListener("click", async function () {
    var id = ($("da-discord-id").value || "").replace(/\D/g, "");
    if (id.length < 15) {
      setMsg("Cole o ID numérico do Discord.", "error");
      return;
    }
    setMsg("Enviando código...", "");
    if (window.gzSetBtnLoading) window.gzSetBtnLoading($("da-btn-send"), true);
    try {
      var res = await window.gzFetch("/api/auth/discord-pin.php", {
        method: "POST",
        body: JSON.stringify({ action: "send", discordId: id, mode: mode }),
      });
      var data = await res.json();
      if (!res.ok || !data.ok) throw new Error(data.message || "Falha ao enviar");
      setMsg(data.message || "Código enviado na DM.", "ok");
      show($("da-step-code"), true);
      $("da-code").focus();
    } catch (e) {
      setMsg(e.message || "Erro", "error");
    } finally {
      if (window.gzSetBtnLoading) window.gzSetBtnLoading($("da-btn-send"), false);
    }
  });

  $("da-btn-confirm").addEventListener("click", async function () {
    var id = ($("da-discord-id").value || "").replace(/\D/g, "");
    var code = ($("da-code").value || "").trim();
    if (!code) {
      setMsg("Informe o código da DM.", "error");
      return;
    }
    setMsg("Confirmando...", "");
    if (window.gzSetBtnLoading) window.gzSetBtnLoading($("da-btn-confirm"), true);
    try {
      var res = await window.gzFetch("/api/auth/discord-pin.php", {
        method: "POST",
        body: JSON.stringify({ action: "confirm", discordId: id, code: code, mode: mode }),
      });
      var data = await res.json();
      if (!res.ok || !data.ok) throw new Error(data.message || "Falha");
      if (data.token && window.gzSetToken) window.gzSetToken(data.token);
      setMsg(data.message || "OK!", "ok");
      setTimeout(function () {
        window.location.href = mode === "link" ? "/conta?discord=linked" : "/";
      }, 600);
    } catch (e) {
      setMsg(e.message || "Erro", "error");
      if (window.gzSetBtnLoading) window.gzSetBtnLoading($("da-btn-confirm"), false);
    }
  });

  $("da-btn-back").addEventListener("click", function () {
    show($("da-step-code"), false);
    $("da-code").value = "";
    setMsg("", "");
  });
})();
</script>
</body>
</html>
