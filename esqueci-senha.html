<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Esqueci a senha - Geração Zero</title>
  <link rel="icon" type="image/png" href="assets/img/logo.png?v=1">
  <link rel="stylesheet" href="assets/css/bulma.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/gz.css?v=29">
</head>
<body>
<header class="section">
  <div class="logo container"><a href="/"><img src="assets/img/logo.png?v=1" alt="Geração Zero"></a></div>
</header>
<main class="section">
  <div class="container">
    <div class="columns is-centered">
      <div class="column is-5">
        <article class="article produto-sidebar">
          <h1 class="article-title"><i class="fas fa-key"></i> Esqueci a senha</h1>
          <div class="article-content">
            <p id="auth-msg" class="checkout-msg is-hidden" aria-live="polite"></p>
            <p>Informe o e-mail da conta. Se o envio de e-mail ainda não estiver ativo no servidor, abra um ticket no Discord.</p>
            <form id="form-forgot">
              <div class="field">
                <label class="label" for="forgot-email">E-mail</label>
                <div class="control">
                  <input id="forgot-email" class="input" type="email" required>
                </div>
              </div>
              <button type="submit" class="button is-success is-fullwidth">Enviar link</button>
            </form>
            <a href="/login" class="button is-link is-fullwidth" style="margin-top:0.75rem">Voltar ao login</a>
            <a href="https://discord.gg/pAtKdPHBk2" target="_blank" rel="noreferrer" class="button is-dark is-fullwidth" style="margin-top:0.5rem">Ajuda no Discord</a>
          </div>
        </article>
      </div>
    </div>
  </div>
</main>
<script src="assets/js/config.js?v=3"></script>
<script>
(function () {
  var form = document.getElementById("form-forgot");
  var msg = document.getElementById("auth-msg");
  function setMsg(t, ok) {
    msg.textContent = t || "";
    msg.className = "checkout-msg" + (t ? (ok ? " is-ok" : " is-error") : " is-hidden");
  }
  form.addEventListener("submit", async function (e) {
    e.preventDefault();
    setMsg("Enviando...", true);
    try {
      var res = await window.gzFetch("/api/auth/forgot.php", {
        method: "POST",
        body: JSON.stringify({ email: document.getElementById("forgot-email").value.trim() })
      });
      var data = await res.json();
      setMsg(data.message || "Solicitação enviada", !!data.ok);
      if (data.devResetUrl) {
        setMsg((data.message || "") + " Link: " + data.devResetUrl, true);
      }
    } catch (err) {
      setMsg(err.message || "Falha ao solicitar", false);
    }
  });
})();
</script>
<script defer src="https://use.fontawesome.com/releases/v5.12.1/js/all.js"></script>
</body>
</html>
