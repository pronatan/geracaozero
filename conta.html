<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Minha conta - Geração Zero</title>
  <link rel="icon" type="image/png" href="assets/img/logo.png?v=1">
  <link rel="stylesheet" href="assets/css/bulma.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/gz.css?v=16">
</head>
<body>

<header class="section">
  <div class="logo container">
    <a href="/"><img src="assets/img/logo.png?v=1" alt="Geração Zero"></a>
  </div>
  <div class="container">
    <nav class="navbar">
      <div class="navbar-brand">
        <div class="navbar-auth-brand" data-auth-slot="brand"></div>
        <a class="navbar-burger burger" aria-label="menu" aria-expanded="false">
          <span aria-hidden="true"></span><span aria-hidden="true"></span><span aria-hidden="true"></span>
        </a>
      </div>
      <div class="navbar-menu">
        <div class="navbar-start">
          <a href="/" class="navbar-item"><i class="fas fa-home"></i> Início</a>
          <a href="/loja" class="navbar-item"><i class="fas fa-shopping-cart"></i> Loja</a>
          <a href="https://discord.gg/pAtKdPHBk2" target="_blank" rel="noreferrer" class="navbar-item"><i class="fab fa-discord"></i> Discord</a>
        </div>
        <div class="navbar-end">
          <div data-auth-slot="end"></div>
          <a id="ip" class="navbar-item" title="Clique para copiar">
            <i class="fas fa-copy"></i> <span>geracaozero.bedrock.net.br</span>
            <textarea></textarea>
          </a>
        </div>
      </div>
    </nav>
  </div>
</header>

<main class="section">
  <div class="container">
    <div id="conta-gate" class="article is-hidden" style="text-align:center">
      <h1 class="article-title">Minha conta</h1>
      <p>Faça login para gerenciar sua conta.</p>
      <a href="/login" class="button is-primary">Entrar</a>
    </div>

    <div id="conta-app" class="columns is-multiline is-hidden">
      <div class="column is-5">
        <article class="article produto-sidebar">
          <h1 class="article-title"><i class="fas fa-user-cog"></i> Minha conta</h1>
          <div class="article-content">
            <p id="conta-msg" class="checkout-msg is-hidden" aria-live="polite"></p>

            <div id="conta-avatar" class="gz-avatar-chip gz-avatar-chip-lg" style="margin-bottom:1rem"></div>

            <p><b>Nick:</b> <span id="conta-nick">-</span></p>
            <p><b>E-mail:</b> <span id="conta-email-view">-</span></p>
            <p id="conta-role-wrap" class="is-hidden"><b>Tipo:</b> <span id="conta-role">user</span></p>

            <hr>
            <h2 class="article-title" style="font-size:0.7rem">Atualizar dados</h2>
            <form id="form-conta">
              <div class="field">
                <label class="label" for="conta-email">E-mail</label>
                <div class="control">
                  <input id="conta-email" class="input" type="email" required>
                </div>
              </div>
              <div class="field">
                <label class="label" for="conta-pass-current">Senha atual (só se for trocar)</label>
                <div class="control">
                  <input id="conta-pass-current" class="input" type="password" autocomplete="current-password">
                </div>
              </div>
              <div class="field">
                <label class="label" for="conta-pass-new">Nova senha</label>
                <div class="control">
                  <input id="conta-pass-new" class="input" type="password" minlength="6" autocomplete="new-password">
                </div>
              </div>
              <div class="field">
                <label class="label" for="conta-pass-confirm">Confirmar nova senha</label>
                <div class="control">
                  <input id="conta-pass-confirm" class="input" type="password" minlength="6" autocomplete="new-password">
                </div>
              </div>
              <button type="submit" class="button is-success is-fullwidth">Salvar</button>
            </form>
            <a id="conta-admin-link" href="/admin" class="button is-link is-fullwidth is-hidden" style="margin-top:0.75rem">Acessar painel</a>
          </div>
        </article>
      </div>

      <div class="column is-7">
        <article class="article">
          <h1 class="article-title"><i class="fas fa-receipt"></i> Meus pedidos</h1>
          <div class="article-content">
            <div id="conta-orders" class="admin-table-wrap">Carregando...</div>
          </div>
        </article>
      </div>
    </div>
  </div>
</main>

<footer class="section">
  <div class="container">
    <article class="footer">
      <span>Geração Zero <script>document.write(new Date().getFullYear())</script> &copy; Todos os direitos reservados.</span>
      <span class="is-muted"><i class="fas fa-code"></i> Base: Próprio</span>
    </article>
  </div>
</footer>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
<script src="assets/js/config.js?v=3"></script>
<script src="assets/js/gz.js?v=8"></script>
<script src="assets/js/avatar.js?v=1"></script>
<script src="assets/js/auth.js?v=13"></script>
<script src="assets/js/conta.js?v=5"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/js/all.min.js"></script>
<script src="assets/js/password-toggle.js?v=4"></script>
</body>
</html>
