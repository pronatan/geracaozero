# Só redirecionamentos (não redefine location / — evita conflito com o default do EB).
# O ProxyServer=apache no .ebextensions faz o .htaccess cuidar das URLs limpas.
# Este arquivo cobre o caso residual se o proxy ainda for nginx.

location = /index.html {
    return 301 /;
}

location ~ ^/(.+)\.html$ {
    return 301 /$1;
}
